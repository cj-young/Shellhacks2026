<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;width:{{ w }}px;height:{{ h }}px">
<svg width="40" height="84" viewBox="0 0 40 84" style="position:absolute;left:0;top:50%;margin-top:-42px"><path d="M34 8 Q4 8 4 42 Q4 76 34 76" fill="none" stroke="#2B2A6B" stroke-width="16" stroke-linecap="round"></path><path d="M34 8 Q4 8 4 42 Q4 76 34 76" fill="none" stroke="#C9803F" stroke-width="7" stroke-linecap="round"></path></svg>
<svg width="40" height="84" viewBox="0 0 40 84" style="position:absolute;right:0;top:50%;margin-top:-42px"><path d="M6 8 Q36 8 36 42 Q36 76 6 76" fill="none" stroke="#2B2A6B" stroke-width="16" stroke-linecap="round"></path><path d="M6 8 Q36 8 36 42 Q36 76 6 76" fill="none" stroke="#C9803F" stroke-width="7" stroke-linecap="round"></path></svg>
<div style="position:absolute;top:0;bottom:0;left:26px;right:26px;border-radius:40px;background-color:#E9A866;background-image:repeating-linear-gradient(0deg,rgba(201,128,63,.6) 0 5px,transparent 5px 13px),repeating-linear-gradient(90deg,rgba(255,255,255,.22) 0 5px,transparent 5px 13px);border:5px solid #2B2A6B;box-shadow:0 10px 0 rgba(43,42,107,.16);box-sizing:border-box;padding:12px">
<div style="width:100%;height:100%;border-radius:28px;background:#C9803F;border:4px solid #2B2A6B;box-shadow:inset 0 8px 0 rgba(43,42,107,.18);box-sizing:border-box;display:flex;flex-wrap:nowrap;align-items:center;justify-content:center;gap:{{ gap }}px;padding:4px">
<sc-for list="{{ list }}" as="it" hint-placeholder-count="3">
<sc-if value="{{ it.here }}" hint-placeholder-val="{{ true }}"><div style="width:{{ tok }}px;height:{{ tok }}px;display:flex;align-items:center;justify-content:center"><dc-import name="Ingredient" kind="{{ it.kind }}" size="{{ icon }}" hint-size="46px,46px"></dc-import></div></sc-if>
<sc-if value="{{ it.gone }}" hint-placeholder-val="{{ false }}"><div style="width:{{ tok }}px;height:{{ tok }}px;border-radius:50%;border:4px dashed #fff;box-sizing:border-box;opacity:.8"></div></sc-if>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:380,&quot;height&quot;:170},&quot;items&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;tomato,garlic,bread&quot;,&quot;tsType&quot;:&quot;string[] | string&quot;},&quot;gone&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:-1,&quot;tsType&quot;:&quot;number&quot;},&quot;width&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:346,&quot;tsType&quot;:&quot;number&quot;},&quot;height&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:140,&quot;tsType&quot;:&quot;number&quot;},&quot;token&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:66,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const items = Array.isArray(p.items) ? p.items : String(p.items ?? 'tomato,garlic,bread').split(',').filter(Boolean);
    const gone = p.gone === undefined || p.gone === null ? -1 : Number(p.gone);
    const w = Number(p.width ?? 346), h = Number(p.height ?? 140), gap = 6;
    const innerW = w - 52 - 10 - 24 - 8 - 8, innerH = h - 10 - 24 - 8 - 8;
    const n = Math.max(1, items.length);
    const tok = Math.max(28, Math.min(Number(p.token ?? 66), innerH, Math.floor((innerW - gap * (n - 1)) / n)));
    return {
      w, h, gap, tok, icon: Math.round(tok * 0.9),
      list: items.map((kind, i) => ({ kind, here: i !== gone, gone: i === gone }))
    };
  }
}
</script>
</body>
</html>
