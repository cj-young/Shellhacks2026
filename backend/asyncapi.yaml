asyncapi: 3.1.0

info:
  title: Shellhacks Game Realtime API
  version: 0.1.0
  description: |
    Socket.IO API used for game lobbies.

    Clients connect to the Socket.IO endpoint with handshake auth
    `{ code, name, token?, reconnectToken? }`:

    - `code`           - the 6-character game code
    - `name`           - the display name chosen by the player
    - `token`          - the host token returned by `POST /api/games`; sent only by the host
    - `reconnectToken` - a per-player token returned in `joined`; send it back to resume the
      same player, including after the game has started

    The public path is `/api/socket.io/` (Caddy strips the `/api` prefix before proxying to
    the backend, which serves Socket.IO at `/socket.io/`). The event names below are
    Socket.IO event names.

    A join can fail: the server emits `game_error` and then disconnects the socket.

servers:
  local:
    host: localhost:8080
    protocol: socket.io
    pathname: /api/socket.io/
    description: Local development (through Caddy)
    x-socketio:
      path: /api/socket.io/
      transports:
        - websocket
        - polling
      auth:
        type: object
        required:
          - code
        properties:
          code:
            type: string
            description: Six-character game code.
          name:
            type: string
            description: |
              Display name chosen by the player (trimmed, whitespace collapsed, capped at 20
              characters). Falls back to "Host" or "Player" when absent.
          token:
            type: string
            description: Host token. Sent only by the host.
          reconnectToken:
            type: string
            description: |
              Per-player resume token returned in `joined`. Send it to reconnect as the same
              player without consuming a new slot.

channels:
  joined:
    address: joined
    title: Joined
    description: Sent to a client once it has successfully joined a lobby.
    x-socketio:
      event: joined
    messages:
      joined:
        $ref: '#/components/messages/Joined'
  playerJoined:
    address: player_joined
    title: Player joined
    description: Sent to every other member when a player joins the lobby.
    x-socketio:
      event: player_joined
    messages:
      playerJoined:
        $ref: '#/components/messages/PlayerJoined'
  playerDisconnected:
    address: player_disconnected
    title: Player disconnected
    description: |
      Sent to the remaining members when a player disconnects. The player is kept in the
      roster with `connected: false` and can return with their reconnect token.
    x-socketio:
      event: player_disconnected
    messages:
      playerDisconnected:
        $ref: '#/components/messages/PlayerDisconnected'
  gameStarted:
    address: game_started
    title: Game started
    description: Broadcast to every member when the host starts the game.
    x-socketio:
      event: game_started
    messages:
      gameStarted:
        $ref: '#/components/messages/GameStarted'
  gameError:
    address: game_error
    title: Game error
    description: |
      Sent to the affected client when an operation fails. A failed join is followed by a
      server-initiated disconnect.
    x-socketio:
      event: game_error
    messages:
      gameError:
        $ref: '#/components/messages/GameError'
  startGame:
    address: start_game
    title: Start game
    description: |
      Sent by the host to start the game. A non-host sender receives `game_error` with code
      `NOT_HOST`; starting an already-active game returns `ALREADY_STARTED`.
    x-socketio:
      event: start_game
    messages:
      startGame:
        $ref: '#/components/messages/StartGame'
  purchaseItems:
    address: purchase_items
    title: Purchase items
    description: |
      Sent by a player to buy store items. Purchases are free and all-or-nothing, and are only
      accepted while the game is active. On success the server broadcasts `update_state` (with
      the updated inventories) to everyone; on failure the sender receives `game_error` with
      `GAME_NOT_ACTIVE`, `PLAYER_NOT_FOUND` or `INVALID_ITEM`.
    x-socketio:
      event: purchase_items
    messages:
      purchaseItems:
        $ref: '#/components/messages/PurchaseItems'

operations:
  sendJoined:
    action: send
    summary: Notify a client that it joined, including the current roster.
    channel:
      $ref: '#/channels/joined'
  sendPlayerJoined:
    action: send
    summary: Notify members that a player joined.
    channel:
      $ref: '#/channels/playerJoined'
  sendPlayerDisconnected:
    action: send
    summary: Notify members that a player disconnected.
    channel:
      $ref: '#/channels/playerDisconnected'
  sendGameStarted:
    action: send
    summary: Notify all members that the game started.
    channel:
      $ref: '#/channels/gameStarted'
  sendGameError:
    action: send
    summary: Report a failed operation to the affected client.
    channel:
      $ref: '#/channels/gameError'
  receiveStartGame:
    action: receive
    summary: Receive a start request from the host.
    channel:
      $ref: '#/channels/startGame'
  receivePurchaseItems:
    action: receive
    summary: Receive a purchase request from a player.
    channel:
      $ref: '#/channels/purchaseItems'

components:
  messages:
    Joined:
      name: joined
      title: Joined
      payload:
        $ref: '#/components/schemas/JoinedPayload'
    PlayerJoined:
      name: player_joined
      title: Player joined
      payload:
        $ref: '#/components/schemas/PlayerSummary'
    PlayerDisconnected:
      name: player_disconnected
      title: Player disconnected
      payload:
        $ref: '#/components/schemas/PlayerDisconnectedPayload'
    GameStarted:
      name: game_started
      title: Game started
      payload:
        $ref: '#/components/schemas/GameStartedPayload'
    GameError:
      name: game_error
      title: Game error
      payload:
        $ref: '#/components/schemas/GameErrorPayload'
    StartGame:
      name: start_game
      title: Start game
      description: No payload.
    PurchaseItems:
      name: purchase_items
      title: Purchase items
      payload:
        $ref: '#/components/schemas/PurchaseItemsPayload'
  schemas:
    PlayerSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - joinedAt
        - isHost
        - connected
        - inventory
      properties:
        id:
          type: string
          description: Server-assigned player identifier (UUID).
          examples:
            - 2bee17e1-01a8-4a5e-b47e-3e74a1661657
        name:
          type: string
          description: Display name chosen by the player (trimmed, max 20 characters).
          examples:
            - Ada Lovelace
        joinedAt:
          type: integer
          description: Join time as a Unix timestamp in milliseconds.
          examples:
            - 1790400532276
        isHost:
          type: boolean
          description: True only for the player that presented the matching host token.
        connected:
          type: boolean
          description: False when the player has disconnected but is still in the roster.
        inventory:
          type: object
          description: Map of ingredient id to the quantity held.
          additionalProperties:
            type: integer
          examples:
            - { "0": 2 }
    JoinedPayload:
      type: object
      additionalProperties: false
      required:
        - playerId
        - gameCode
        - isHost
        - reconnectToken
        - players
      properties:
        playerId:
          type: string
          description: Identifier of the recipient.
        gameCode:
          type: string
          pattern: '^[ABCDEFGHJKMNPQRSTUVWXYZ23456789]{6}$'
        isHost:
          type: boolean
        reconnectToken:
          type: string
          description: Per-player resume token. Only sent to the recipient.
        players:
          type: array
          description: Full roster including the recipient.
          items:
            $ref: '#/components/schemas/PlayerSummary'
    PlayerDisconnectedPayload:
      type: object
      additionalProperties: false
      required:
        - playerId
      properties:
        playerId:
          type: string
    GameStartedPayload:
      type: object
      additionalProperties: false
      required:
        - gameCode
      properties:
        gameCode:
          type: string
          pattern: '^[ABCDEFGHJKMNPQRSTUVWXYZ23456789]{6}$'
    PurchaseItem:
      type: object
      additionalProperties: false
      required:
        - id
        - count
      properties:
        id:
          type: integer
          description: Ingredient id (positional index into the ingredients catalogue).
          examples:
            - 0
        count:
          type: integer
          description: Quantity to add (1-99).
          minimum: 1
          maximum: 99
          examples:
            - 2
    PurchaseItemsPayload:
      type: array
      description: Items to purchase. Processed all-or-nothing.
      items:
        $ref: '#/components/schemas/PurchaseItem'
    GameErrorPayload:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Machine-readable error code.
          enum:
            - GAME_NOT_FOUND
            - GAME_STARTED
            - GAME_FULL
            - GAME_NOT_ACTIVE
            - PLAYER_NOT_FOUND
            - INVALID_ITEM
            - NOT_HOST
            - ALREADY_STARTED
            - INTERNAL_ERROR
        message:
          type: string
          description: Human-readable error message.
          examples:
            - No game found for that code
