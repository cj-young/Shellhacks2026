<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:140,&quot;height&quot;:140},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;tomato&quot;,&quot;redpepper&quot;,&quot;greenonion&quot;,&quot;leek&quot;,&quot;lemon&quot;,&quot;lime&quot;,&quot;butter&quot;,&quot;cheese&quot;,&quot;flour&quot;,&quot;sugar&quot;,&quot;carrot&quot;,&quot;mushroom&quot;,&quot;onion&quot;,&quot;garlic&quot;,&quot;chili&quot;,&quot;salt&quot;,&quot;egg&quot;,&quot;milk&quot;,&quot;chicken&quot;,&quot;fish&quot;,&quot;bacon&quot;,&quot;rice&quot;,&quot;bread&quot;,&quot;bun&quot;],&quot;default&quot;:&quot;tomato&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:80,&quot;tsType&quot;:&quot;number&quot;},&quot;outline&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;silhouette&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;mood&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;worried&quot;],&quot;default&quot;:&quot;none&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sticker&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;rotate&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const k = p.kind ?? 'tomato';
    const s = Number(p.size ?? 80);
    const sil = p.silhouette === true || p.silhouette === 'true';
    const sticker = !(p.sticker === false || p.sticker === 'false');
    const P = { red: '#F2553D', green: '#3CB54A', dkgreen: '#1E8A4A', ltgreen: '#BFEBD9', white: '#FFFFFF', cream: '#FFF1D2', lemon: '#FFD83A', lime: '#8FD14F',
      butter: '#FFE58A', butterTop: '#FFF3C2', cheese: '#FFC928', cheeseTop: '#FFDD6B', cheeseDk: '#E8A51C', blue: '#1F4FD8', sky: '#4FB3F0', skyLt: '#CFE6FB',
      pink: '#F48FB7', bacon: '#FF8A7A', tan: '#E9A866', gold: '#F2BE63', orange: '#FF9A3C', steak: '#D9474A', hi: '#FFFFFF' };
    const c = {};
    Object.keys(P).forEach(key => c[key] = sil ? '#2B2A6B' : P[key]);
    if (sil) c.hi = 'none';
    const outline = !(p.outline === false || p.outline === 'false');
    if (!sil && !outline) { c.white = '#E3EAF6'; c.cream = '#FBE3B8'; c.skyLt = '#B9D9F7'; c.butterTop = '#FFEFA6'; }
    const ink = sil || outline ? '#2B2A6B' : 'none', line = sil || outline ? '#2B2A6B' : 'rgba(43,42,107,.5)';
    const kinds = ['tomato','redpepper','greenonion','leek','lemon','lime','butter','cheese','flour','sugar','carrot','mushroom','onion','garlic','chili','salt','egg','milk','chicken','fish','bacon','rice','bread','bun','steak','yogurt','cream'];
    const sh = {};
    kinds.forEach(n => sh[n] = n === k ? 'inline' : 'none');
    const fyMap = { tomato: 62, redpepper: 62, lemon: 56, lime: 60, egg: 58, cheese: 64, bread: 64, bun: 46, onion: 64, garlic: 64, mushroom: 70, carrot: 48, fish: 52, butter: 66, chicken: 42 };
    const fxMap = { fish: 40, butter: 30, chicken: 64 };
    const worried = p.mood === 'worried' && !sil;
    const fy = fyMap[k] ?? 58, fx = fxMap[k] ?? 50;
    const d = Math.max(2, Math.round(s / 26));
    return {
      ink, line, s, sh, c, rot: p.rotate ?? 0,
      faceOn: worried ? 'inline' : 'none', fy, e1: fx - 9, e2: fx + 9,
      brows: `M${fx - 15} ${fy - 7} L${fx - 6} ${fy - 11} M${fx + 15} ${fy - 7} L${fx + 6} ${fy - 11}`,
      mouth: `M${fx - 7} ${fy + 10} Q${fx - 3.5} ${fy + 6} ${fx} ${fy + 10} Q${fx + 3.5} ${fy + 14} ${fx + 7} ${fy + 10}`,
      drop: `M${fx + 26} ${fy - 22} Q${fx + 32} ${fy - 13} ${fx + 29} ${fy - 9} Q${fx + 26} ${fy - 6} ${fx + 23} ${fy - 9} Q${fx + 20} ${fy - 13} ${fx + 26} ${fy - 22}Z`,
      filter: sticker ? `drop-shadow(${d}px 0 0 #fff) drop-shadow(-${d}px 0 0 #fff) drop-shadow(0 ${d}px 0 #fff) drop-shadow(0 -${d}px 0 #fff) drop-shadow(0 ${d + 2}px 0 rgba(43,42,107,.16))` : 'none'
    };
  }
}
</script>
