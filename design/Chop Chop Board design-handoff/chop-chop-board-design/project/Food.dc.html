<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:inline-block;line-height:0;width:{{ s }}px;height:{{ s }}px;filter:{{ filter }};transform:rotate({{ rot }}deg)">
<svg width="{{ s }}" height="{{ s }}" viewBox="0 0 100 100" fill="none" stroke="#2B2A6B" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" style="overflow:visible">
<g display="{{ sh.tomato }}">
<circle cx="50" cy="57" r="36" fill="#F2553D"></circle>
<path d="M32 26 Q42 31 50 22 Q58 31 68 26 Q63 36 50 36 Q37 36 32 26Z" fill="#3CB54A"></path>
<path d="M50 22 L52 11"></path>
<ellipse cx="31" cy="46" rx="7" ry="4.5" transform="rotate(-35 31 46)" fill="#fff" stroke="none"></ellipse>
</g>
<g display="{{ sh.dumpling }}">
<path d="M9 68 Q11 29 50 27 Q89 29 91 68 Q50 83 9 68Z" fill="#FFF1D2"></path>
<path d="M36 33 Q40 41 36 47 M50 29 Q54 39 50 45 M64 33 Q68 41 64 47" stroke-width="3.5"></path>
<ellipse cx="24" cy="54" rx="6" ry="4" transform="rotate(-40 24 54)" fill="#fff" stroke="none"></ellipse>
</g>
<g display="{{ sh.egg }}">
<path d="M18 50 Q14 20 46 18 Q80 12 86 42 Q94 72 64 84 Q30 92 18 70 Q10 60 18 50Z" fill="#fff"></path>
<circle cx="52" cy="50" r="19" fill="#FFC928"></circle>
<ellipse cx="45" cy="42" rx="5" ry="3.5" transform="rotate(-30 45 42)" fill="#fff" stroke="none"></ellipse>
</g>
<g display="{{ sh.onigiri }}">
<path d="M50 12 Q60 12 84 60 Q92 82 70 84 L30 84 Q8 82 16 60 Q40 12 50 12Z" fill="#fff"></path>
<rect x="36" y="64" width="28" height="20" rx="3" fill="#1E5A45"></rect>
</g>
<g display="{{ sh.mushroom }}">
<path d="M36 56 L34 84 Q50 92 66 84 L64 56 Z" fill="#FFF1D2"></path>
<path d="M10 58 Q12 16 50 16 Q88 16 90 58 Z" fill="#F2553D"></path>
<circle cx="33" cy="36" r="6" fill="#fff" stroke="none"></circle><circle cx="57" cy="28" r="5" fill="#fff" stroke="none"></circle><circle cx="72" cy="45" r="5" fill="#fff" stroke="none"></circle>
</g>
<g display="{{ sh.greens }}">
<path d="M50 92 Q14 72 22 30 Q38 10 50 32 Q62 10 78 30 Q86 72 50 92Z" fill="#3CB54A"></path>
<path d="M50 38 L50 86"></path>
<ellipse cx="34" cy="38" rx="5" ry="3" transform="rotate(-40 34 38)" fill="#fff" stroke="none"></ellipse>
</g>
<g display="{{ sh.carrot }}">
<ellipse cx="42" cy="18" rx="6" ry="12" transform="rotate(-25 42 18)" fill="#3CB54A"></ellipse>
<ellipse cx="58" cy="18" rx="6" ry="12" transform="rotate(25 58 18)" fill="#3CB54A"></ellipse>
<path d="M50 92 Q28 62 28 44 Q28 28 50 28 Q72 28 72 44 Q72 62 50 92Z" fill="#FF9A3C"></path>
<path d="M36 60 L42 60 M56 70 L62 70" stroke-width="3.5"></path>
</g>
<g display="{{ sh.sauce }}">
<path d="M50 10 Q78 46 76 64 Q74 88 50 88 Q26 88 24 64 Q22 46 50 10Z" fill="#F2553D"></path>
<ellipse cx="36" cy="54" rx="5" ry="8" transform="rotate(20 36 54)" fill="#fff" stroke="none"></ellipse>
</g>
<g display="{{ sh.bowl }}">
<path d="M16 50 Q20 22 50 22 Q80 22 84 50 Z" fill="#fff"></path>
<ellipse cx="32" cy="40" rx="9" ry="6" fill="#3CB54A" stroke-width="3.5"></ellipse>
<circle cx="70" cy="40" r="8" fill="#F2553D" stroke-width="3.5"></circle>
<circle cx="50" cy="33" r="9" fill="#FFC928" stroke-width="3.5"></circle>
<path d="M8 50 H92 Q90 88 50 90 Q10 88 8 50Z" fill="#1F4FD8"></path>
<circle cx="30" cy="66" r="3" fill="#fff" stroke="none"></circle><circle cx="50" cy="72" r="3" fill="#fff" stroke="none"></circle><circle cx="70" cy="66" r="3" fill="#fff" stroke="none"></circle>
<ellipse cx="20" cy="60" rx="3" ry="6" fill="#4FB3F0" stroke="none"></ellipse>
</g>
<g display="{{ sh.face }}">
<circle cx="{{ e1 }}" cy="{{ fy }}" r="3.8" fill="#2B2A6B" stroke="none"></circle>
<circle cx="{{ e2 }}" cy="{{ fy }}" r="3.8" fill="#2B2A6B" stroke="none"></circle>
<ellipse cx="{{ b1 }}" cy="{{ by }}" rx="5" ry="3" fill="#F48FB7" stroke="none"></ellipse>
<ellipse cx="{{ b2 }}" cy="{{ by }}" rx="5" ry="3" fill="#F48FB7" stroke="none"></ellipse>
<path d="{{ mouth }}" stroke-width="3"></path>
</g>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:140,&quot;height&quot;:140},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;tomato&quot;,&quot;dumpling&quot;,&quot;egg&quot;,&quot;onigiri&quot;,&quot;mushroom&quot;,&quot;greens&quot;,&quot;carrot&quot;,&quot;sauce&quot;,&quot;bowl&quot;],&quot;default&quot;:&quot;tomato&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:80,&quot;tsType&quot;:&quot;number&quot;},&quot;face&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;sticker&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;rotate&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const k = p.kind ?? 'tomato';
    const s = Number(p.size ?? 80);
    const fyMap = { tomato: 60, dumpling: 58, egg: 52, onigiri: 48, mushroom: 72, greens: 58, carrot: 46, sauce: 64 };
    const fy = fyMap[k];
    const face = !(p.face === false || p.face === 'false') && fy !== undefined;
    const on = c => c ? 'inline' : 'none';
    const sticker = !(p.sticker === false || p.sticker === 'false');
    const d = Math.max(2, Math.round(s / 26));
    const fx = 50, f = fy || 50;
    const sh = { face: on(face) };
    ['tomato', 'dumpling', 'egg', 'onigiri', 'mushroom', 'greens', 'carrot', 'sauce', 'bowl'].forEach(n => sh[n] = on(n === k));
    return {
      s, sh, rot: p.rotate ?? 0, fy: f, e1: fx - 10, e2: fx + 10, b1: fx - 19, b2: fx + 19, by: f + 7,
      mouth: `M${fx - 5} ${f + 5} Q${fx} ${f + 10} ${fx + 5} ${f + 5}`,
      filter: sticker ? `drop-shadow(${d}px 0 0 #fff) drop-shadow(-${d}px 0 0 #fff) drop-shadow(0 ${d}px 0 #fff) drop-shadow(0 -${d}px 0 #fff) drop-shadow(0 ${d + 2}px 0 rgba(43,42,107,.16))` : 'none'
    };
  }
}
</script>
</body>
</html>
