asyncapi: 3.1.0

info:
  title: Shellhacks Game Realtime API
  version: 0.1.0
  description: |
    Socket.IO API used for game lobbies.

    Clients connect to the Socket.IO endpoint with handshake auth
    `{ code, name, token?, reconnectToken? }`:

    - `code`           - the 6-character game code
    - `name`           - the display name chosen by the player
    - `token`          - the host token returned by `POST /api/games`; sent only by the host
    - `reconnectToken` - a per-player token returned in `joined`; send it back to resume the
      same player, including after the game has started

    The public path is `/api/socket.io/` (Caddy strips the `/api` prefix before proxying to
    the backend, which serves Socket.IO at `/socket.io/`). The event names below are
    Socket.IO event names.

    A join can fail: the server emits `game_error` and then disconnects the socket.

    While frozen, `purchase_items`, `update_cart`, `update_interface_state`,
    `consume_ingredients`, `finish_stage`, and `use_sabotage` return `PLAYER_FROZEN`.
    Freeze does not pause the round timer or existing spoil deadlines. Blackout is a
    presentation effect for every player's store (including its sender); shopping remains
    allowed. Active timed effects and credit balances are included in `update_state`,
    including on reconnect. Expiry has no dedicated event.

servers:
  local:
    host: localhost:8080
    protocol: socket.io
    pathname: /api/socket.io/
    description: Local development (through Caddy)
    x-socketio:
      path: /api/socket.io/
      transports:
        - websocket
        - polling
      auth:
        type: object
        required:
          - code
        properties:
          code:
            type: string
            description: Six-character game code.
          name:
            type: string
            description: |
              Display name chosen by the player (trimmed, whitespace collapsed, capped at 20
              characters). Falls back to "Host" or "Player" when absent.
          token:
            type: string
            description: Host token. Sent only by the host.
          reconnectToken:
            type: string
            description: |
              Per-player resume token returned in `joined`. Send it to reconnect as the same
              player without consuming a new slot.

channels:
  updateState:
    address: update_state
    title: Shared game state
    description: |
      Authoritative game snapshot sent after mutations and on active-game reconnect.
      Includes inventories, recipe progress, available choice credits, and unexpired
      timed sabotages. Clients use serverNow to convert expiry timestamps locally.
    messages:
      updateState:
        $ref: "#/components/messages/UpdateState"
  joined:
    address: joined
    title: Joined
    description: Sent to a client once it has successfully joined a lobby.
    x-socketio:
      event: joined
    messages:
      joined:
        $ref: "#/components/messages/Joined"
  playerJoined:
    address: player_joined
    title: Player joined
    description: Sent to every other member when a player joins the lobby.
    x-socketio:
      event: player_joined
    messages:
      playerJoined:
        $ref: "#/components/messages/PlayerJoined"
  playerDisconnected:
    address: player_disconnected
    title: Player disconnected
    description: |
      Sent to the remaining members when a player disconnects. The player is kept in the
      roster with `connected: false` and can return with their reconnect token.
    x-socketio:
      event: player_disconnected
    messages:
      playerDisconnected:
        $ref: "#/components/messages/PlayerDisconnected"
  gameStarted:
    address: game_started
    title: Game started
    description: Broadcast to every member when the host starts the game.
    x-socketio:
      event: game_started
    messages:
      gameStarted:
        $ref: "#/components/messages/GameStarted"
  gameError:
    address: game_error
    title: Game error
    description: |
      Sent to the affected client when an operation fails. A failed join is followed by a
      server-initiated disconnect.
    x-socketio:
      event: game_error
    messages:
      gameError:
        $ref: "#/components/messages/GameError"
  startGame:
    address: start_game
    title: Start game
    description: |
      Sent by the host to start the game. A non-host sender receives `game_error` with code
      `NOT_HOST`; starting an already-active game returns `ALREADY_STARTED`.
    x-socketio:
      event: start_game
    messages:
      startGame:
        $ref: "#/components/messages/StartGame"
  purchaseItems:
    address: purchase_items
    title: Purchase items
    description: |
      Sent by a player to buy store items. Purchases are free and all-or-nothing, and are only
      accepted while the game is active. On success the server broadcasts `update_state` (with
      the updated inventories) to everyone; on failure the sender receives `game_error` with
      `GAME_NOT_ACTIVE`, `PLAYER_NOT_FOUND` or `INVALID_ITEM`.
    x-socketio:
      event: purchase_items
    messages:
      purchaseItems:
        $ref: "#/components/messages/PurchaseItems"
  updateInterfaceState:
    address: update_interface_state
    title: Update interface state
    description: |
      Sets the authenticated player's active phone screen during an active game.
      Broadcasts update_state with players[].interfaceState so the host can select
      shopping or prep cards. Invalid values return INVALID_INTERFACE_STATE.
    messages:
      updateInterfaceState:
        $ref: "#/components/messages/UpdateInterfaceState"
  updateCart:
    address: update_cart
    title: Update cart
    description: |
      Sent by a player whenever their client-side cart changes. The payload replaces that
      player's cart in shared state; an empty list clears it. On success the server broadcasts
      `update_state` so the host and other clients can read the cart contents.
    x-socketio:
      event: update_cart
    messages:
      updateCart:
        $ref: "#/components/messages/UpdateCart"
  consumeIngredients:
    address: consume_ingredients
    title: Consume ingredients
    description: |
      Sent by a player when a recipe stage begins. The requested ingredient counts are removed
      atomically from that player's inventory while the game is active. On success the server
      broadcasts `update_state`; on failure the sender receives `game_error` with
      `GAME_NOT_ACTIVE`, `PLAYER_NOT_FOUND`, `INVALID_ITEM`, or `INSUFFICIENT_INVENTORY`.
    x-socketio:
      event: consume_ingredients
    messages:
      consumeIngredients:
        $ref: "#/components/messages/ConsumeIngredients"
  finishStage:
    address: finish_stage
    title: Finish stage
    description: |
      Sent by a player when they complete the current recipe stage. The server advances the
      player's stage progress; completing the last stage of a recipe awards points, subtracts a
      waste penalty for leftover inventory, clears the inventory, and moves to the next recipe.
      Each completed recipe grants non-host players one saved choice credit (including the last recipe).
      On success the server broadcasts `update_state`; on failure the sender receives
      `game_error` with `GAME_NOT_ACTIVE`, `PLAYER_NOT_FOUND` or `ALREADY_FINISHED`.
    x-socketio:
      event: finish_stage
    messages:
      finishStage:
        $ref: "#/components/messages/FinishStage"
  timerSync:
    address: timer_sync
    title: Timer sync
    description: |
      Sent once when the round starts (and to a client that joins an active game). Carries the
      absolute `roundEndsAt` plus the server clock (`serverNow`) so clients can compute their
      clock offset and tick down locally. The server ends the round authoritatively with
      `game_ended`.
    x-socketio:
      event: timer_sync
    messages:
      timerSync:
        $ref: "#/components/messages/TimerSync"
  gameEnded:
    address: game_ended
    title: Game ended
    description: |
      Broadcast when the round timer expires. Carries the final rankings; the game status
      becomes `finished` and further play events are rejected.
    x-socketio:
      event: game_ended
    messages:
      gameEnded:
        $ref: "#/components/messages/GameEnded"
  useSabotage:
    address: use_sabotage
    title: Use sabotage
    description: |
      Sent by a non-host player to spend one saved choice credit during an active game.
      Credits are earned on recipe completion and may be spent on any known definition.
      `definitionId` names the sabotage; for `single`-target sabotages `targetPlayerId` is
      required and must identify another connected non-host in this room. Steal/trash remove
      one randomly selected unused inventory ingredient (never a cart or consumed ingredient);
      an empty inventory is INVALID_TARGET. Steal adds that item to the sender.
      Freeze lasts 10000 ms, blackout 15000 ms; overlapping effects expire independently.
      The server consumes a credit only after successful validation, broadcasts
      `sabotage_applied` to the room (including the sender), then `update_state`.
      Hosts and disconnected senders are rejected with PLAYER_NOT_FOUND. No available credit
      returns SABOTAGE_ALREADY_USED. A failed action never spends a credit. On failure the sender receives
      `game_error` with `GAME_NOT_ACTIVE`, `PLAYER_NOT_FOUND`, `SABOTAGE_NOT_FOUND`,
      `SABOTAGE_ALREADY_USED`, `PLAYER_FROZEN`, or `INVALID_TARGET`.
    x-socketio:
      event: use_sabotage
    messages:
      useSabotage:
        $ref: "#/components/messages/UseSabotage"
  sabotageApplied:
    address: sabotage_applied
    title: Sabotage applied
    description: |
      Broadcast to every member when a sabotage is used. Carries everything the frontend
      needs to react: the definition, who used it, who it targets (null for `all`), timing
      (`appliedAt`, `expiresAt`, `serverNow`), and the affected ingredient for instant
      inventory effects. Timed effects have no end event; clients clear them locally.
    x-socketio:
      event: sabotage_applied
    messages:
      sabotageApplied:
        $ref: "#/components/messages/SabotageApplied"

operations:
  sendUpdateState:
    action: send
    summary: Broadcast authoritative shared state, credit balances, and timed effects.
    channel:
      $ref: "#/channels/updateState"
  sendJoined:
    action: send
    summary: Notify a client that it joined, including the current roster.
    channel:
      $ref: "#/channels/joined"
  sendPlayerJoined:
    action: send
    summary: Notify members that a player joined.
    channel:
      $ref: "#/channels/playerJoined"
  sendPlayerDisconnected:
    action: send
    summary: Notify members that a player disconnected.
    channel:
      $ref: "#/channels/playerDisconnected"
  sendGameStarted:
    action: send
    summary: Notify all members that the game started.
    channel:
      $ref: "#/channels/gameStarted"
  sendGameError:
    action: send
    summary: Report a failed operation to the affected client.
    channel:
      $ref: "#/channels/gameError"
  receiveStartGame:
    action: receive
    summary: Receive a start request from the host.
    channel:
      $ref: "#/channels/startGame"
  receivePurchaseItems:
    action: receive
    summary: Receive a purchase request from a player.
    channel:
      $ref: "#/channels/purchaseItems"
  receiveUpdateInterfaceState:
    action: receive
    summary: Receive the player's active store/recipe screen.
    channel:
      $ref: "#/channels/updateInterfaceState"
  receiveUpdateCart:
    action: receive
    summary: Receive a client-side cart snapshot from a player.
    channel:
      $ref: "#/channels/updateCart"
  receiveConsumeIngredients:
    action: receive
    summary: Receive a request to consume ingredients for a recipe stage.
    channel:
      $ref: "#/channels/consumeIngredients"
  receiveFinishStage:
    action: receive
    summary: Receive a stage-completion request from a player.
    channel:
      $ref: "#/channels/finishStage"
  sendTimerSync:
    action: send
    summary: Send the round end time and the server clock once.
    channel:
      $ref: "#/channels/timerSync"
  sendGameEnded:
    action: send
    summary: Announce the end of the round with final rankings.
    channel:
      $ref: "#/channels/gameEnded"
  receiveUseSabotage:
    action: receive
    summary: Receive a request from a player to use a sabotage.
    channel:
      $ref: "#/channels/useSabotage"
  sendSabotageApplied:
    action: send
    summary: Broadcast that a sabotage was used, and what it affects.
    channel:
      $ref: "#/channels/sabotageApplied"

components:
  messages:
    UpdateState:
      name: update_state
      payload:
        $ref: "#/components/schemas/ClientGameState"
    Joined:
      name: joined
      title: Joined
      payload:
        $ref: "#/components/schemas/JoinedPayload"
    PlayerJoined:
      name: player_joined
      title: Player joined
      payload:
        $ref: "#/components/schemas/PlayerSummary"
    PlayerDisconnected:
      name: player_disconnected
      title: Player disconnected
      payload:
        $ref: "#/components/schemas/PlayerDisconnectedPayload"
    GameStarted:
      name: game_started
      title: Game started
      payload:
        $ref: "#/components/schemas/GameStartedPayload"
    GameError:
      name: game_error
      title: Game error
      payload:
        $ref: "#/components/schemas/GameErrorPayload"
    StartGame:
      name: start_game
      title: Start game
      description: No payload.
    PurchaseItems:
      name: purchase_items
      title: Purchase items
      payload:
        $ref: "#/components/schemas/PurchaseItemsPayload"
    UpdateInterfaceState:
      name: update_interface_state
      payload:
        $ref: "#/components/schemas/PlayerInterfaceState"
    UpdateCart:
      name: update_cart
      title: Update cart
      payload:
        $ref: "#/components/schemas/PurchaseItemsPayload"
    ConsumeIngredients:
      name: consume_ingredients
      title: Consume ingredients
      payload:
        $ref: "#/components/schemas/PurchaseItemsPayload"
    FinishStage:
      name: finish_stage
      title: Finish stage
      description: No payload.
    TimerSync:
      name: timer_sync
      title: Timer sync
      payload:
        $ref: "#/components/schemas/TimerSyncPayload"
    GameEnded:
      name: game_ended
      title: Game ended
      payload:
        $ref: "#/components/schemas/GameEndedPayload"
    UseSabotage:
      name: use_sabotage
      title: Use sabotage
      payload:
        $ref: "#/components/schemas/UseSabotagePayload"
    SabotageApplied:
      name: sabotage_applied
      title: Sabotage applied
      payload:
        $ref: "#/components/schemas/SabotageAppliedPayload"
  schemas:
    ClientGameState:
      type: object
      additionalProperties: false
      required:
        [
          recipeOrder,
          players,
          roundStartedAt,
          roundEndsAt,
          serverNow,
          activeSabotages,
        ]
      properties:
        recipeOrder:
          type: array
          items:
            type: object
            description: Recipe definition with ingredients and gesture stages from the recipe catalogue.
        players:
          type: array
          items:
            $ref: "#/components/schemas/PlayerSummary"
        roundStartedAt:
          type: [integer, "null"]
        roundEndsAt:
          type: [integer, "null"]
        serverNow:
          type: integer
          description: Server clock (Unix milliseconds) when this snapshot was created.
        activeSabotages:
          type: array
          description: |
            Unexpired timed applications only, empty after round end. Snapshot entries restore
            effects without replaying notifications or spending credits. serverNow is refreshed
            for each snapshot; clients clear effects locally at expiresAt.
          items:
            $ref: "#/components/schemas/SabotageAppliedPayload"
    PlayerInterfaceState:
      type: string
      enum: [store, recipe]
      description: Active phone screen; initially store, preserved on reconnect.
    PlayerSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - joinedAt
        - isHost
        - connected
        - cart
        - inventory
        - interfaceState
        - recipeIndex
        - recipeStageIndex
        - score
        - stageDeadlineAt
        - sabotageCredits
        - character
      properties:
        id:
          type: string
          description: Server-assigned player identifier (UUID).
          examples:
            - 2bee17e1-01a8-4a5e-b47e-3e74a1661657
        name:
          type: string
          description: Display name chosen by the player (trimmed, max 20 characters).
          examples:
            - Ada Lovelace
        joinedAt:
          type: integer
          description: Join time as a Unix timestamp in milliseconds.
          examples:
            - 1790400532276
        isHost:
          type: boolean
          description: True only for the player that presented the matching host token.
        connected:
          type: boolean
          description: False when the player has disconnected but is still in the roster.
        cart:
          type: object
          description: Map of ingredient id to the quantity currently in the player's cart.
          additionalProperties:
            type: integer
          examples:
            - { "1": 2 }
        inventory:
          type: object
          description: Map of ingredient id to the quantity held.
          additionalProperties:
            type: integer
          examples:
            - { "0": 2 }
        interfaceState:
          $ref: "#/components/schemas/PlayerInterfaceState"
        recipeIndex:
          type: integer
          description: Index of the player's current recipe within the recipe order.
          examples:
            - 0
        recipeStageIndex:
          type: integer
          description: Index of the current stage within the player's current recipe.
          examples:
            - 0
        score:
          type: integer
          description: Current score (may be negative after waste penalties).
          examples:
            - 100
        sabotageCredits:
          type: integer
          minimum: 0
          description: Unspent choice credits; each completed recipe earns one, each successful sabotage spends one.
        character:
          type: [string, "null"]
          description: Selected chef character.
        stageDeadlineAt:
          type:
            - integer
            - "null"
          description: |
            Epoch ms when the current stage's time limit expires, or null. It is only set while
            the player lacks the current stage's ingredients; once they hold enough it clears.
            If it elapses while they are still short, their inventory is cleared and the
            current recipe restarts at stage 0 (no score change).
          examples:
            - 1790400532276
    JoinedPayload:
      type: object
      additionalProperties: false
      required:
        - playerId
        - gameCode
        - isHost
        - reconnectToken
        - players
      properties:
        playerId:
          type: string
          description: Identifier of the recipient.
        gameCode:
          type: string
          pattern: "^[ABCDEFGHJKMNPQRSTUVWXYZ23456789]{6}$"
        isHost:
          type: boolean
        reconnectToken:
          type: string
          description: Per-player resume token. Only sent to the recipient.
        players:
          type: array
          description: Full roster including the recipient.
          items:
            $ref: "#/components/schemas/PlayerSummary"
    PlayerDisconnectedPayload:
      type: object
      additionalProperties: false
      required:
        - playerId
      properties:
        playerId:
          type: string
    GameStartedPayload:
      type: object
      additionalProperties: false
      required:
        - gameCode
      properties:
        gameCode:
          type: string
          pattern: "^[ABCDEFGHJKMNPQRSTUVWXYZ23456789]{6}$"
    PurchaseItem:
      type: object
      additionalProperties: false
      required:
        - id
        - count
      properties:
        id:
          type: integer
          description: Ingredient id from the ingredients catalogue.
          examples:
            - 1
        count:
          type: integer
          description: Quantity to add (1-99).
          minimum: 1
          maximum: 99
          examples:
            - 2
    PurchaseItemsPayload:
      type: array
      description: Items to purchase. Processed all-or-nothing.
      items:
        $ref: "#/components/schemas/PurchaseItem"
    TimerSyncPayload:
      type: object
      additionalProperties: false
      required:
        - roundEndsAt
        - serverNow
      properties:
        roundEndsAt:
          type: integer
          description: Unix timestamp (ms) when the round ends.
          examples:
            - 1790400532276
        serverNow:
          type: integer
          description: Server clock at send time (ms); clients use it to compute a clock offset.
          examples:
            - 1790400448276
    PlayerResult:
      type: object
      additionalProperties: false
      required:
        - playerId
        - name
        - score
      properties:
        playerId:
          type: string
        name:
          type: string
        score:
          type: integer
          examples:
            - 100
    GameEndedPayload:
      type: object
      additionalProperties: false
      required:
        - results
      properties:
        results:
          type: array
          description: Players ranked by score (highest first).
          items:
            $ref: "#/components/schemas/PlayerResult"
    SabotageTargetScope:
      type: string
      enum: [self, single, all]
      description: |
        How a sabotage selects its target(s): `self` (the user), `single` (one other player,
        supplied as `targetPlayerId`), or `all` (everyone).
    SabotageDefinition:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - description
        - targetScope
        - durationMs
      properties:
        id:
          type: string
          description: Stable sabotage definition id.
          examples:
            - steal
            - freeze
            - blackout
        name:
          type: string
          examples:
            - Steal
        description:
          type: string
          examples:
            - Take an unused ingredient from another player's inventory.
        targetScope:
          $ref: "#/components/schemas/SabotageTargetScope"
        durationMs:
          type:
            - integer
            - "null"
          description: Default duration in ms for timed effects; null for instantaneous effects.
          examples:
            - 10000
    UseSabotagePayload:
      type: object
      additionalProperties: false
      required:
        - definitionId
      properties:
        definitionId:
          type: string
          description: |
            Which known sabotage definition to choose. The server consumes one of the sender's
            saved choice credits, regardless of definition. Credits are awarded on recipe completion.
          examples:
            - steal
        targetPlayerId:
          type: string
          description: |
            Target player id. Required when the definition's `targetScope` is `single`; omitted
            for `self`, ignored for `all`.
          examples:
            - 2bee17e1-01a8-4a5e-b47e-3e74a1661657
    SabotageAppliedPayload:
      type: object
      additionalProperties: false
      required:
        - id
        - definition
        - sourcePlayerId
        - targetPlayerId
        - appliedAt
        - expiresAt
        - serverNow
        - ingredientId
      properties:
        id:
          type: string
          description: Unique id for this application (clients key animations off it).
        definition:
          $ref: "#/components/schemas/SabotageDefinition"
        sourcePlayerId:
          type: string
          description: Player that used the sabotage.
        targetPlayerId:
          type:
            - string
            - "null"
          description: Player the effect targets, or null when the effect targets everyone.
        appliedAt:
          type: integer
          description: Server time (ms) when the sabotage was applied.
        expiresAt:
          type:
            - integer
            - "null"
          description: |
            Server time (ms) when a timed effect ends, or null for instantaneous effects. There
            is no expiry event: clients compute the end from `expiresAt` and `serverNow` and
            clear locally.
        serverNow:
          type: integer
          description: Server clock at send time (ms); clients use it to compute a clock offset.
        ingredientId:
          type:
            - integer
            - "null"
          description: |
            For instant inventory effects (steal/trash), the affected ingredient id; null
            otherwise. Authoritative inventories arrive in the accompanying `update_state`.
    GameErrorPayload:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Machine-readable error code.
          enum:
            - GAME_NOT_FOUND
            - GAME_STARTED
            - GAME_FULL
            - GAME_NOT_ACTIVE
            - PLAYER_NOT_FOUND
            - INVALID_ITEM
            - INVALID_INTERFACE_STATE
            - INSUFFICIENT_INVENTORY
            - ALREADY_FINISHED
            - NOT_HOST
            - ALREADY_STARTED
            - PLAYER_FROZEN
            - SABOTAGE_NOT_FOUND
            - SABOTAGE_ALREADY_USED
            - INVALID_TARGET
            - INTERNAL_ERROR
        message:
          type: string
          description: Human-readable error message.
          examples:
            - No game found for that code
