<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:inline-block;line-height:0;width:{{ s }}px;height:{{ s }}px;transform:rotate({{ rot }}deg)">
<svg width="{{ s }}" height="{{ s }}" viewBox="0 0 24 24" fill="{{ color }}" style="overflow:visible">
<g display="{{ sh.knife }}"><rect x="1.5" y="15" width="10" height="5" rx="2.5" transform="rotate(-45 6.5 17.5)"></rect><path d="M9 13 L18 4 Q22.5 2 21.5 7 Q19.5 12 12 16Z"></path></g>
<g display="{{ sh.pan }}"><circle cx="10" cy="13.5" r="7.5"></circle><rect x="15" y="4.5" width="8.5" height="4" rx="2" transform="rotate(-35 19 6.5)"></rect></g>
<g display="{{ sh.cloche }}"><path d="M3 17 Q3 7 12 7 Q21 7 21 17Z"></path><rect x="1.5" y="17.5" width="21" height="3.5" rx="1.75"></rect><circle cx="12" cy="5" r="2.2"></circle></g>
<g display="{{ sh.basket }}"><path d="M2.5 11 H21.5 L19.3 20 Q18.9 21.5 17.2 21.5 H6.8 Q5.1 21.5 4.7 20Z"></path><path d="M5 11 Q5 3 12 3 Q19 3 19 11 H16.4 Q16.4 5.6 12 5.6 Q7.6 5.6 7.6 11Z"></path></g>
<g display="{{ sh.flame }}"><path d="M12 1.5 Q20.5 10 19.5 15.5 Q18.8 22.5 12 22.5 Q5.2 22.5 4.6 15.5 Q4.6 10 9 7 Q9 11 11 12 Q10 6 12 1.5Z"></path></g>
<g display="{{ sh.check }}"><path d="M2.5 12.5 L6.3 8.8 L10 12.5 L17.7 4.8 L21.5 8.6 L10 20Z"></path></g>
<g display="{{ sh.plus }}"><rect x="9.3" y="2.5" width="5.4" height="19" rx="2.7"></rect><rect x="2.5" y="9.3" width="19" height="5.4" rx="2.7"></rect></g>
<g display="{{ sh.heart }}"><path d="M12 21.5 Q2.5 15 2.5 9 Q2.5 3.5 7.5 3.5 Q10.5 3.5 12 6.8 Q13.5 3.5 16.5 3.5 Q21.5 3.5 21.5 9 Q21.5 15 12 21.5Z"></path></g>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:60,&quot;height&quot;:60},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;knife&quot;,&quot;pan&quot;,&quot;cloche&quot;,&quot;basket&quot;,&quot;flame&quot;,&quot;check&quot;,&quot;plus&quot;,&quot;heart&quot;],&quot;default&quot;:&quot;knife&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:24,&quot;tsType&quot;:&quot;number&quot;},&quot;color&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#2B2850&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;rotate&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const k = this.props.kind ?? 'knife';
    const sh = {};
    ['knife', 'pan', 'cloche', 'basket', 'flame', 'check', 'plus', 'heart'].forEach(n => sh[n] = n === k ? 'inline' : 'none');
    return { sh, s: Number(this.props.size ?? 24), color: this.props.color ?? '#2B2850', rot: this.props.rotate ?? 0 };
  }
}
</script>
</body>
</html>
