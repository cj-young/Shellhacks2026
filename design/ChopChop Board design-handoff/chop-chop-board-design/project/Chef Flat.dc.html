<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:200,&quot;height&quot;:260},&quot;animal&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;bunny&quot;,&quot;bear&quot;,&quot;cat&quot;,&quot;kid&quot;,&quot;puppy&quot;],&quot;default&quot;:&quot;bunny&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;hat&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;toque&quot;,&quot;bandana&quot;,&quot;beret&quot;,&quot;frilly&quot;],&quot;default&quot;:&quot;toque&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;expr&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;happy&quot;,&quot;focused&quot;,&quot;panicked&quot;,&quot;celebrating&quot;],&quot;default&quot;:&quot;happy&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;pose&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;down&quot;,&quot;up&quot;,&quot;wave&quot;],&quot;default&quot;:&quot;down&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;color&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#4C63D2&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:160,&quot;tsType&quot;:&quot;number&quot;},&quot;bust&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;mitts&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;rotate&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const a = p.animal ?? 'bunny', hat = p.hat ?? 'toque', expr = p.expr ?? 'happy';
    const bust = p.bust === true || p.bust === 'true';
    const mitts = p.mitts === true || p.mitts === 'true';
    const pose = p.pose ?? (expr === 'celebrating' ? 'up' : 'down');
    const w = Number(p.size ?? 160), vbH = bust ? 175 : 212;
    const on = c => c ? 'inline' : 'none';
    const F = { bunny: ['#E6E3F7', '#C9C3EE'], bear: ['#C98552', '#A96A3C'], cat: ['#F2B36B', '#DE9650'], kid: ['#FFD9BF', '#6B3E2E'], puppy: ['#F6E1C0', '#C98552'] }[a] || ['#fff', '#ddd'];
    return {
      w, h: Math.round(w * vbH / 160), vb: `0 -20 160 ${vbH}`, rot: p.rotate ?? 0,
      fur: F[0], detail: F[1], brow: a === 'kid' ? '#6B3E2E' : (a === 'bunny' ? '#A59CE0' : F[1]),
      color: p.color ?? '#4C63D2', arm: mitts ? '#E4502F' : F[0],
      sh: {
        bunny: on(a === 'bunny'), bear: on(a === 'bear'), cat: on(a === 'cat'), kid: on(a === 'kid'), puppy: on(a === 'puppy'),
        body: on(!bust), bustBody: on(bust),
        arcEyes: on(expr === 'happy' || expr === 'celebrating'), happy: on(expr === 'happy'), focused: on(expr === 'focused'), panicked: on(expr === 'panicked'), celebrating: on(expr === 'celebrating'),
        toque: on(hat === 'toque'), bandana: on(hat === 'bandana'), beret: on(hat === 'beret'), frilly: on(hat === 'frilly'),
        armLDown: on(!bust && pose !== 'up'), armLUp: on(!bust && pose === 'up'),
        armRDown: on(!bust && pose === 'down'), armRUp: on(!bust && (pose === 'up' || pose === 'wave'))
      }
    };
  }
}
</script>
