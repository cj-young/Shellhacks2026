</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:200,&quot;height&quot;:240},&quot;animal&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;bunny&quot;,&quot;bear&quot;,&quot;cat&quot;,&quot;puppy&quot;,&quot;kid&quot;],&quot;default&quot;:&quot;bunny&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;hat&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;toque&quot;,&quot;bandana&quot;,&quot;beanie&quot;,&quot;beret&quot;,&quot;earmuffs&quot;],&quot;default&quot;:&quot;toque&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;expr&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;happy&quot;,&quot;focused&quot;,&quot;panicked&quot;,&quot;celebrating&quot;],&quot;default&quot;:&quot;happy&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;pose&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;down&quot;,&quot;up&quot;,&quot;wave&quot;],&quot;default&quot;:&quot;down&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;color&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#1F4FD8&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:160,&quot;tsType&quot;:&quot;number&quot;},&quot;bust&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;sticker&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;rotate&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const a = p.animal ?? 'bunny', hat = p.hat ?? 'toque', expr = p.expr ?? 'happy';
    const pose = p.pose ?? (expr === 'celebrating' ? 'up' : 'down');
    const bust = p.bust === true || p.bust === 'true';
    const w = Number(p.size ?? 160), vbH = bust ? 142 : 190;
    const h = Math.round(w * vbH / 160);
    const on = c => c ? 'inline' : 'none';
    const d = Math.max(2, Math.round(w / 45));
    const sticker = !(p.sticker === false || p.sticker === 'false');
    const fur = { bunny: '#FFFDF6', bear: '#E9A86B', cat: '#C7CEEC', puppy: '#FFE2B5', kid: '#FFD9BF' }[a] || '#fff';
    return {
      w, h, vb: `0 -10 160 ${vbH}`, fur, color: p.color ?? '#1F4FD8', rot: p.rotate ?? 0,
      filter: sticker ? `drop-shadow(${d}px 0 0 #fff) drop-shadow(-${d}px 0 0 #fff) drop-shadow(0 ${d}px 0 #fff) drop-shadow(0 -${d}px 0 #fff) drop-shadow(0 ${d + 2}px 0 rgba(43,42,107,.16))` : 'none',
      sh: {
        body: on(!bust), bunny: on(a === 'bunny'), bear: on(a === 'bear'), cat: on(a === 'cat'), puppy: on(a === 'puppy'), kid: on(a === 'kid'),
        happy: on(expr === 'happy'), focused: on(expr === 'focused'), panicked: on(expr === 'panicked'), celebrating: on(expr === 'celebrating'),
        toque: on(hat === 'toque'), bandana: on(hat === 'bandana'), beanie: on(hat === 'beanie'), beret: on(hat === 'beret'), earmuffs: on(hat === 'earmuffs'),
        armLDown: on(!bust && pose !== 'up'), armLUp: on(!bust && pose === 'up'),
        armRDown: on(!bust && pose === 'down'), armRUp: on(!bust && (pose === 'up' || pose === 'wave'))
      }
    };
  }
}
</script>
</body>
</html>
