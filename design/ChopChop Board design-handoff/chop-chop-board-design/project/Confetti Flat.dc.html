<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:inline-block;line-height:0;width:{{ s }}px;height:{{ s }}px;transform:rotate({{ rot }}deg);pointer-events:none">
<svg width="{{ s }}" height="{{ s }}" viewBox="0 0 24 24" fill="{{ color }}" style="overflow:visible">
<path display="{{ sh.leaf }}" d="M12 1.5 Q23 10 12 22.5 Q1 10 12 1.5Z"></path>
<polygon display="{{ sh.maple }}" points="12,1 14,6.5 18.5,4.5 17.2,9.5 22.5,9.5 18.5,13.5 20.5,16.5 14.5,15.8 13,22.5 11,22.5 9.5,15.8 3.5,16.5 5.5,13.5 1.5,9.5 6.8,9.5 5.5,4.5 10,6.5"></polygon>
<g display="{{ sh.flower }}"><circle cx="12" cy="5.5" r="4.5"></circle><circle cx="18.2" cy="10" r="4.5"></circle><circle cx="15.8" cy="17.3" r="4.5"></circle><circle cx="8.2" cy="17.3" r="4.5"></circle><circle cx="5.8" cy="10" r="4.5"></circle><circle cx="12" cy="12" r="3.6" fill="#F6C84C"></circle></g>
<g display="{{ sh.circles }}"><circle cx="12" cy="18" r="5.5"></circle><circle cx="12" cy="9.5" r="4"></circle><circle cx="12" cy="3.5" r="2.5"></circle></g>
<path display="{{ sh.star }}" d="M12 1 Q13.6 10.4 23 12 Q13.6 13.6 12 23 Q10.4 13.6 1 12 Q10.4 10.4 12 1Z"></path>
<circle display="{{ sh.dot }}" cx="12" cy="12" r="6"></circle>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:60,&quot;height&quot;:60},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;leaf&quot;,&quot;maple&quot;,&quot;flower&quot;,&quot;circles&quot;,&quot;star&quot;,&quot;dot&quot;],&quot;default&quot;:&quot;star&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:28,&quot;tsType&quot;:&quot;number&quot;},&quot;color&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#F6C84C&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;rotate&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const k = this.props.kind ?? 'star';
    const sh = {};
    ['leaf', 'maple', 'flower', 'circles', 'star', 'dot'].forEach(n => sh[n] = n === k ? 'inline' : 'none');
    return { sh, s: Number(this.props.size ?? 28), color: this.props.color ?? '#F6C84C', rot: this.props.rotate ?? 0 };
  }
}
</script>
</body>
</html>
